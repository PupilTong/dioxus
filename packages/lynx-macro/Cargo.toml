[package]
name = "dioxus-lynx-macro"
version = { workspace = true }
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Lynx-specific procedural macros for Dioxus"
rust-version = "1.85.0"

[lib]
name = "dioxus_lynx_macro"
proc-macro = true

[dependencies]
cssparser = { workspace = true }
dioxus-lynx-sys = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full"] }

[dev-dependencies]
trybuild = { workspace = true }
